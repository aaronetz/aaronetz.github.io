        body {

            color: #333;

            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            margin-bottom: 5px;
            color: #111;
            font-size: 2.2em;
        }
        h2 {
            font-size: 1.1em;
            font-weight: normal;
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .featured-app {
            background-color: #f8f9fa;
            border: 1px solid #eaeaea;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }
        .featured-app h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .featured-app p {
            margin: 0;
            color: #555;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .portfolio-section {
            margin-bottom: 35px;
        }
        .portfolio-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .store-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .btn-apple {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-google {
            background-color: #01875f;
            color: #ffffff;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .support-section {
            border-top: 1px solid #eee;
            padding-top: 25px;
            font-size: 0.95em;
            color: #666;
        }
        .support-section a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }
        .support-section a:hover {
            text-decoration: underline;
