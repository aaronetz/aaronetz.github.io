<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperPaintSplash</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: black; touch-action: none; }
        /* C++ WebGL Canvas at the bottom */
        #gl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* Compose UI Container on top (Changed from canvas to div) */
        #compose-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: transparent; }

        /* Ensure the canvas Compose creates inside the div also stays transparent */
        #compose-container canvas { background: transparent; }
    </style>
</head>
<body>
    <canvas id="gl-canvas"></canvas>
    <div id="compose-container"></div> <script src="superpaint_wasm.js"></script>
    <script>
        window.superPaintModule = null;
        window.isSuperPaintReady = false;

        createSuperPaintModule({ canvas: document.getElementById('gl-canvas') }).then(function(Module) {
            window.superPaintModule = Module;
            window.isSuperPaintReady = true;

            // Fix: Scale the EGL surface to physical pixels
            const dpr = window.devicePixelRatio || 1;
            const glCanvas = document.getElementById('gl-canvas');
            glCanvas.width = window.innerWidth * dpr;
            glCanvas.height = window.innerHeight * dpr;
        });
    </script>

    <script src="composeApp.js"></script>
</body>
</html>
